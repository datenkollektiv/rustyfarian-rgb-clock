[package]
name = "rustyfarian-esp-hal-rgb-clock"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
# esp-hal 1.2 and esp-rtos 0.4 declare rust-version 1.95.
rust-version = "1.95"
description = "RGB LED clock (esp-hal bare-metal runtime) - ESP32-C3, 12 WS2812 LEDs"
license = "MIT"
publish = false

[[bin]]
name = "rustyfarian-esp-hal-rgb-clock"
path = "src/main.rs"
test = false
doctest = false
bench = false

[features]
default = []
# Exactly one chip feature per build; `just *-hal` recipes pass `--features esp32c3`.
# esp32c6 follows with milestone M4.
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-println/esp32c3",
    "esp-backtrace/esp32c3",
    "rustyfarian-esp-hal-ws2812/esp32c3",
    "rustyfarian-esp-hal-network/esp32c3",
    "esp-alloc/esp32c3",
    "esp-storage/esp32c3",
    "esp-radio/esp32c3",
]

[dependencies]
# September 2026 esp-hal wave, exact pins copied from the upstream workspaces.
esp-hal = { version = "=1.2.2", features = ["unstable"] }
esp-rtos = { version = "=0.4.0", default-features = false, features = ["embassy"] }
esp-bootloader-esp-idf = { version = "=0.6.0", default-features = false }
# Console is the UART bridge. No `defmt` feature: defmt sections broke the IDF link
# and the tiers share one Cargo.lock.
esp-println = { version = "=0.18.0", default-features = false, features = ["uart", "critical-section", "log-04"] }
esp-backtrace = { version = "=0.20.0", default-features = false, features = ["panic-handler", "println"] }
embassy-executor = { version = "=0.10.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false }
# `default-features = false` is mandatory: upstream defaults to esp32c6.
# No `pennant` feature: the clock never hands the ring to the network crate.
rustyfarian-esp-hal-ws2812 = { version = "0.9.0", default-features = false, features = ["unstable"] }
rgb = "0.8"
log = "0.4"
clock-pure = { path = "../clock-pure" }
clock-app = { path = "../clock-app" }
# Provisioning, Wi-Fi and MQTT from crates.io. Same version as every other manifest,
# so the graph has one juggler (docs/adr/006-one-clock-app-on-both-tiers.md).
# `default-features = false` keeps the `ws2812` feature off: our own ws2812
# dependency above is the only one.
rustyfarian-esp-hal-network = { version = "0.7.0", default-features = false, features = ["provisioning", "mqtt", "embassy", "rt"] }
juggler = { version = "0.7.0", default-features = false, features = ["wifi", "mqtt"] }
static_cell = "2.1"
heapless = "0.9"
# Same exact pins as the network crate, so the graph keeps one version of each.
esp-alloc = "=0.11.0"
# `critical-section` keeps flash writes safe while the radio runs; `embedded-storage`
# provides the `NorFlash` impl the provisioning store needs.
esp-storage = { version = "=0.10.0", default-features = false, features = ["critical-section", "embedded-storage"] }
esp-radio = { version = "=1.0.0-beta.1", default-features = false }
embassy-net = { version = "=0.8.0", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
