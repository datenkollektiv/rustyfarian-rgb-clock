[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # atomic-polyfill is unmaintained (RUSTSEC-2023-0089) with no safe upgrade path.
    # It is NOT compiled by this firmware — it appears in Cargo.lock only as a
    # feature-gated-OFF transitive of the network crate's `lora` path, which we do
    # not enable (features = ["wifi", "mqtt", "provisioning", "ota"]). Full chain:
    #   atomic-polyfill 1.0.3 → heapless 0.7.17 → lorawan-device 0.12.2
    #     → juggler 0.6.0 → rustyfarian-esp-idf-network 0.6.0
    # cargo-deny scans the whole lockfile, so it flags the crate even though it is
    # never built. Resolves when lorawan-device 0.12 moves off heapless 0.7.
    "RUSTSEC-2023-0089",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# TEMPORARY: the IDF firmware resolves rustyfarian-esp-idf-network and juggler from a
# local file:// git pin (rev a53c434, not on GitHub yet); everything else is crates.io
# (ws2812 0.7.0). `just deny` checks the root package only, so the esp-hal crate's
# git pin is not scanned here; see docs/features/esp-hal-clock-v1.md.
# Empty this again when both tiers return to crates.io (network 0.7) — a stale entry
# emits `unmatched-source` warnings.
allow-git = ["file:///Users/fluffi/Projects/rustyfarian/scm-repos/rustyfarian-network"]
