[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # atomic-polyfill is unmaintained (RUSTSEC-2023-0089) with no safe upgrade path.
    # It is NOT compiled by this firmware — it appears in Cargo.lock only as a
    # feature-gated-OFF transitive of the network crate's `lora` path, which we do
    # not enable (features = ["wifi", "mqtt", "provisioning", "ota"]). Full chain:
    #   atomic-polyfill 1.0.3 → heapless 0.7.17 → lorawan-device 0.12.2
    #     → juggler 0.7.0 → rustyfarian-esp-idf-network 0.7.0
    # cargo-deny scans the whole lockfile, so it flags the crate even though it is
    # never built. Resolves when lorawan-device 0.12 moves off heapless 0.7.
    "RUSTSEC-2023-0089",
    # chrono is unmaintained (RUSTSEC-2026-0543); all versions are affected, so
    # there is no upgrade path. It runs only on the build host, inside the
    # `build-time` proc-macro that esp-idf-sys uses to stamp the app descriptor's
    # compile date and time — it is never linked into the firmware. Full chain:
    #   chrono 0.4.45 → build-time 0.1.3 (proc-macro) → esp-idf-sys 0.38.1
    #     → esp-idf-hal 0.47.0 → esp-idf-svc 0.53.0 → rustyfarian-rgb-clock
    # Resolves when esp-idf-sys drops build-time or build-time moves off chrono.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every rustyfarian crate (network 0.7.0, ws2812 0.9.0) resolves from crates.io.
allow-git = []
