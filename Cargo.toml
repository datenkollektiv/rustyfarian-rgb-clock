[workspace]
# The bare-metal esp-hal crate is a member but not a default build: the root is a
# real package, so bare `cargo check`/`clippy`/`build` only build the ESP-IDF
# firmware. Build the hal crate explicitly through the `*-hal` just recipes.
members = ["crates/clock-pure", "crates/clock-app", "crates/rustyfarian-esp-hal-rgb-clock"]
resolver = "2"

[workspace.package]
authors = ["Florian Waibel <fwaibel@datenkollektiv.de>"]
edition = "2021"

[workspace.dependencies]
# Common dependencies
anyhow = "1.0"
log = "0.4"
rgb = "0.8"

# ESP-IDF dependencies
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"

# Local crate (app-specific)
clock-pure = { path = "crates/clock-pure" }
clock-app = { path = "crates/clock-app" }

# The rustyfarian-* crate family below shares a common `pennant` (StatusLed)
# dependency. ws2812 and network must resolve the SAME pennant version, or the
# `StatusLed` trait splits into two incompatible types and `WiFiManager::new`
# fails to accept the ws2812 LED (see docs/project-lore.md "Toolchain &
# Dependencies"). Bump these crates together and re-verify, rather than
# upgrading one in isolation.
# Known split (accepted): ws2812 0.9 brings pennant 0.9, while network 0.7 below
# still uses pennant 0.7. It builds because neither tier hands the LED to network
# (`WiFiManager::new_without_led`, esp-hal ws2812 without `pennant`). Close it when
# network moves to the ws2812 0.9 wave.

# External crates from rustyfarian-ws2812 — published to crates.io at 0.9.0
ferriswheel = "0.9.0"
rustyfarian-esp-idf-ws2812 = "0.9.0"

# External crates from rustyfarian-network — published to crates.io at 0.7.0.
# Every manifest naming rustyfarian-esp-idf-network, rustyfarian-esp-hal-network or
# juggler must use the same version, so the graph has ONE juggler and the parity
# traits stay one type (docs/adr/006-one-clock-app-on-both-tiers.md).
# `default = []`, so an explicit feature list is required; `ota` adds `OtaSession`,
# the `ota::runtime` consumer runtime and the `juggler::ota` re-exports.
rustyfarian-esp-idf-network = { version = "0.7.0", default-features = false, features = ["wifi", "mqtt", "provisioning", "ota"] }

# Platform-agnostic juggler traits (`NetworkLink`, `MqttClient`) for the shared clock app,
# same version as above. Tier crates add their own features; `mock` is for host tests.
juggler = { version = "0.7.0", default-features = false, features = ["wifi", "mqtt"] }

[package]
name = "rustyfarian-rgb-clock"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
rust-version = "1.95"
description = "RGB LED clock for ESP32-C6 using WS2812 LEDs and MQTT time synchronization"
license = "MIT"
repository = "https://github.com/datenkollektiv/rustyfarian-rgb-clock"
keywords = ["esp32", "led", "clock", "ws2812", "mqtt"]
categories = ["embedded", "hardware-support"]

[[bin]]
name = "rustyfarian-rgb-clock"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []
# Demo-only image for OTA hardware scenario 6: never passes its health check and
# restarts after 15 s without `mark_valid`, so the bootloader rolls back to the
# previous slot. Built by `just build-unhealthy`; never enabled by `build`/`flash`.
unhealthy = []

[dependencies]
anyhow.workspace = true
log.workspace = true
esp-idf-hal.workspace = true
esp-idf-svc = { workspace = true, features = ["embassy-time-driver"] }
rgb.workspace = true
clock-pure.workspace = true
clock-app.workspace = true
# The esp-idf-svc time driver needs a timer queue behind `embassy_time::Timer`.
embassy-time = { version = "=0.5.1", default-features = false }
embassy-time-queue-utils = { version = "=0.3.2", features = ["generic-queue-16"] }
rustyfarian-esp-idf-network.workspace = true
rustyfarian-esp-idf-ws2812.workspace = true
ferriswheel.workspace = true

[build-dependencies]
embuild = "0.33"
