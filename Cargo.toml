[workspace]
members = ["crates/clock-pure"]
resolver = "2"

[workspace.package]
authors = ["Florian Waibel <fwaibel@datenkollektiv.de>"]
edition = "2021"

[workspace.dependencies]
# Common dependencies
anyhow = "1.0"
log = "0.4"
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ESP-IDF dependencies
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"

# Local crate (app-specific)
clock-pure = { path = "crates/clock-pure" }

# The rustyfarian-* crate family below shares a common `pennant` (StatusLed)
# dependency. ws2812 and network must resolve the SAME pennant version, or the
# `StatusLed` trait splits into two incompatible types and `WiFiManager::new`
# fails to accept the ws2812 LED (see docs/project-lore.md "Toolchain &
# Dependencies"). Bump these crates together and re-verify, rather than
# upgrading one in isolation.

# External crates from rustyfarian-ws2812 — published to crates.io at 0.7.0
ferriswheel = "0.7.0"
rustyfarian-esp-idf-ws2812 = "0.7.0"

# External crate from rustyfarian-network 0.6.0 (crates.io): the OTA decision core
# (`decide_offer` with its `Admission` gate, boot `reconcile`, `OtaError::code`) and
# the OTA consumer runtime (`ota::runtime`: record store, boot reconciliation,
# worker, reporter, health policy; upstream ADR 018), the MQTT callback guard
# (upstream ADR 017, our ADR 005 and bug 001), the `wait_committed` stack fix, and
# MQTT auto-reconnect after a mid-session disconnect (upstream bug 005).
# Same esp-idf-hal 0.47 / esp-idf-svc 0.53 / pennant 0.7 wave as 0.5.0.
# Hardware-validated as release candidate 2a3ac3f (docs/features/ota-mvp-v1.md,
# validation item 11); 0.6.0 differs from it only in doc comments.
# `default = []`, so an explicit feature list is required; `ota` adds `OtaSession`,
# the `ota::runtime` consumer runtime and the `juggler::ota` re-exports.
rustyfarian-esp-idf-network = { version = "0.6.0", default-features = false, features = ["wifi", "mqtt", "provisioning", "ota"] }

[package]
name = "rustyfarian-rgb-clock"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
rust-version = "1.95"
description = "RGB LED clock for ESP32-C6 using WS2812 LEDs and MQTT time synchronization"
license = "MIT"
repository = "https://github.com/datenkollektiv/rustyfarian-rgb-clock"
keywords = ["esp32", "led", "clock", "ws2812", "mqtt"]
categories = ["embedded", "hardware-support"]

[[bin]]
name = "rustyfarian-rgb-clock"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []
# Demo-only image for OTA hardware scenario 6: never passes its health check and
# restarts after 15 s without `mark_valid`, so the bootloader rolls back to the
# previous slot. Built by `just build-unhealthy`; never enabled by `build`/`flash`.
unhealthy = []

[dependencies]
anyhow.workspace = true
log.workspace = true
esp-idf-hal.workspace = true
esp-idf-svc.workspace = true
rgb.workspace = true
serde.workspace = true
serde_json.workspace = true
clock-pure.workspace = true
rustyfarian-esp-idf-network.workspace = true
rustyfarian-esp-idf-ws2812.workspace = true
ferriswheel.workspace = true

# --- Optional Embassy Integration ---
# esp-idf-svc = { version = "0.52", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }

# If you enable embassy-time-driver, you MUST also add one of:

# a) Standalone Embassy libs ( embassy-time, embassy-sync etc.) with a foreign async runtime:
# embassy-time = { version = "0.4.0", features = ["generic-queue-8"] } # NOTE: any generic-queue variant will work

# b) With embassy-executor:
# embassy-executor = { version = "0.7", features = ["executor-thread", "arch-std"] }

# NOTE: if you use embassy-time with embassy-executor you don't need the generic-queue-8 feature

# --- Temporary workaround for embassy-executor < 0.8 ---
# esp-idf-svc = { version = "0.52", features = ["embassy-time-driver", "embassy-sync"] }
# critical-section = { version = "1.1", features = ["std"], default-features = false }

[build-dependencies]
embuild = "0.33"
