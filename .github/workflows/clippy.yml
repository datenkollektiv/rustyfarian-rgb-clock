name: Clippy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fast, host-side lint gate for the host crates (`just ci-clippy`). The firmware
# clippy runs in the `build` job of rust.yml, where the full ESP-IDF toolchain
# (nightly, ldproxy, esp-idf-sys) is already set up — duplicating that here would
# only slow CI down. This job gives early feedback on the platform-independent code
# without waiting on the firmware build.
jobs:
  clippy:
    uses: datenkollektiv/rustyfarian-ci/.github/workflows/host-checks.yml@v1
    with:
      check: clippy
