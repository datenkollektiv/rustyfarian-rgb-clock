name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IDF_VERSION: v6.1

jobs:
  # ===========================================================================
  # Tier 1: Host checks — partition table, partition-validator, flash-script and
  # tick-topic suites, clock-pure/clock-app unit tests (`just ci-test`); cargo-deny (`just ci-deny`)
  # ===========================================================================
  test:
    uses: datenkollektiv/rustyfarian-ci/.github/workflows/host-checks.yml@v1
    with:
      check: test

  deny:
    uses: datenkollektiv/rustyfarian-ci/.github/workflows/host-checks.yml@v1
    with:
      check: deny

  # ===========================================================================
  # Tier 1: Build and Clippy for ESP32-C6
  # ===========================================================================
  build:
    name: Build & Clippy (ESP32-C6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The runner preinstalls Clang 20, 21 and 22, and bindgen's clang-sys loads the
    # newest libclang it finds; libclang 22 breaks the ESP-IDF v6.1 bindings for
    # esp-idf-hal 0.47. Pin bindgen to the runner's libclang 21 (ESP-IDF >= v5.4
    # ships libclang in a separate esp-clang-libs package that esp-idf-sys does not
    # install, so bindgen needs the system libclang).
    env:
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The key covers the files that select the ESP-IDF build: a restored
      # esp-idf-sys CMake tree from another IDF version or sdkconfig fails to configure.
      - name: Setup Rust and just
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-rust-just@v1
        with:
          toolchain: nightly-2026-01-26
          components: rust-src,clippy
          tools: espflash
          cache-key: esp32c6-${{ env.IDF_VERSION }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults') }}

      # The justfile keeps ESP_IDF_TOOLS_INSTALL_DIR=workspace off the RAM disk, which
      # overrides the action's `global` for every `just` recipe.
      - name: Setup ESP-IDF
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-esp-idf@v1
        with:
          idf-version: ${{ env.IDF_VERSION }}
          mcu: esp32c6

      # Credentials are provisioned at runtime (SoftAP portal), not baked in, so
      # no .env is needed to build. See docs/features/archive/wifi-softap-provisioning-v1.md.
      - name: Build, clippy, image check and Wokwi image
        run: just ci-build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            target/riscv32imac-esp-espidf/release/rustyfarian-rgb-clock
            target/riscv32imac-esp-espidf/release/rustyfarian-rgb-clock.bin
          retention-days: 1

  # ===========================================================================
  # Tier 1b: Build and image check for ESP32-C3 (compile-verified only; no
  # Wokwi scenario). Catches target-specific breakage such as the per-chip pin
  # cfg and proves the C3 image fits the shared OTA slots.
  # ===========================================================================
  build-c3:
    name: Build & Image check (ESP32-C3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same libclang 21 pin as the `build` job.
    env:
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust and just
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-rust-just@v1
        with:
          toolchain: nightly-2026-01-26
          components: rust-src,clippy
          tools: espflash
          cache-key: esp32c3-${{ env.IDF_VERSION }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults') }}

      - name: Setup ESP-IDF
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-esp-idf@v1
        with:
          idf-version: ${{ env.IDF_VERSION }}
          mcu: esp32c3

      - name: Build and image check
        run: just ci-build-c3

  # ===========================================================================
  # Tier 2: Wokwi Simulation
  # ===========================================================================
  wokwi:
    name: Wokwi Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # The justfile resolves host_target via rustc at load time; use the runner's
    # stable instead of auto-installing the pinned nightly from rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: target/riscv32imac-esp-espidf/release/

      - name: Prepare the firmware and screenshots directory
        run: just ci-wokwi prepare

      - name: "Wokwi: Boot and Rainbow Animation"
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          timeout: 120000
          scenario: wokwi/test-startup.yaml
          serial_log_file: screenshots/startup-serial.log
        continue-on-error: true
        id: wokwi-startup

      - name: "Wokwi: Rainbow Animation Frames"
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          timeout: 60000
          scenario: wokwi/test-rainbow-frames.yaml
          serial_log_file: screenshots/frames-serial.log
        continue-on-error: true
        id: wokwi-frames

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wokwi-screenshots
          path: screenshots/
          retention-days: 7

      - name: Check Wokwi results
        if: always()
        env:
          STARTUP: ${{ steps.wokwi-startup.outcome }}
          FRAMES: ${{ steps.wokwi-frames.outcome }}
        run: just ci-wokwi check "$STARTUP" "$FRAMES"
