[build]
target = "riscv32imac-esp-espidf"
# If your local copy sets ESP_IDF_TOOLS_INSTALL_DIR = "global", uncomment this so IDE
# tooling (RustRover, rust-analyzer) and bare `cargo` build outside ./target; otherwise
# their esp-idf-sys CMake cache collides with a `just` build. `just` always exports
# CARGO_TARGET_DIR, which overrides this. Leave it commented here: CI's bare
# `cargo build` expects ./target.
# target-dir = "target/ide"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
    "--cfg", "espidf_time64",
    "-C", "force-frame-pointers",
]

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
    "--cfg", "espidf_time64",
    "-C", "force-frame-pointers",
]

# Bare-metal esp-hal tier (`just check-hal` / `build-hal`): no linker or runner,
# espflash is driven by `just flash-hal`. `-fno-stack-protector` is Xtensa-only.
[target.riscv32imc-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
    "-C", "force-frame-pointers",
]

[unstable]
build-std = ["std", "panic_abort"]
# std without its `backtrace` feature: drops the DWARF symbolizer (gimli, addr2line,
# miniz_oxide, rustc-demangle), about 150 KiB of flash, which ESP-IDF v6.1 needed to
# keep the C6 image well inside its OTA slot. Panics still print message and location,
# and the ESP-IDF panic handler still prints registers and a stack dump.
build-std-features = ["panic-unwind"]

[env]
MCU = "esp32c6"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v6.1"
# ESP-IDF tools install location. "workspace" (per-project .embuild) is the default
# used by CI and by non-RAM-disk builds. Keeping "global" OUT of this committed file
# is deliberate: CI builds with this file, and global installs would break esp-idf-sys's
# tool discovery (ninja/compilers). The justfile overrides this to "global"
# (~/.espressif) ONLY when the macOS RAM disk is mounted, so the heavy tools don't
# land on the RAM disk and are shared across rustyfarian projects. See the justfile.
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
# embuild (esp-idf-sys) derives the project root from the parent of target-dir,
# which breaks sdkconfig.defaults discovery when target-dir points outside the
# workspace (e.g. the RAM disk). Setting this explicitly keeps it found.
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
